[scan]
profile = "default"
network = "deny"
max_parallel = 4
timeout_seconds = 300
max_output_mb = 32
follow_symlinks = false
# Findings at or above this severity make the scan exit 1 (policy blocking).
# One of: critical, high, medium, low, info, never.
fail_on = "high"
# Optional per-rule and per-path thresholds; the first matching entry wins,
# path before rule, before the fail_on default above. Patterns are globs.
# BAT84_FAIL_ON_RULES / BAT84_FAIL_ON_PATHS replace these lists with
# pattern=severity entries separated by ';' (an empty value clears them).
# [scan.fail_on_rule]
# "bat84.hardcoded-password" = "never"
#
# [scan.fail_on_path]
# "tests/**" = "never"

[report]
format = "text"
include_source_snippets = false
redact_secrets = true

[remediation]
mode = "plan-only"
require_confirmation = true

[tools.semgrep]
enabled = true
required = false
# Local rules file or directory. When omitted, the bundled policies/semgrep
# directory is used if it is present relative to the working directory.
rules = "policies/semgrep"

