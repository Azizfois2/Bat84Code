[scan]
profile = "default"
network = "deny"
max_parallel = 4
timeout_seconds = 300
max_output_mb = 32
follow_symlinks = false
# Findings at or above this severity make the scan exit 1 (policy blocking).
# One of: critical, high, medium, low, info, never.
fail_on = "high"

[report]
format = "text"
include_source_snippets = false
redact_secrets = true

[remediation]
mode = "plan-only"
require_confirmation = true

[tools.semgrep]
enabled = true
required = false
# Local rules file or directory. When omitted, the bundled policies/semgrep
# directory is used if it is present relative to the working directory.
rules = "policies/semgrep"

